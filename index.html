<style>

<body class="light">

<script type="text/babel">
const {useState,useEffect,useRef,useMemo}=React;
const API="https://script.google.com/macros/s/AKfycbzYkvV52hLbcrf7TFrmDcUdeyXGAOyqTms8_9-RvUHFrg5SpOWs41-pys9Ds1tD0gWy/exec";
const LOGO="https://i.imgur.com/WtkBjp9.png";
const KM=0.96;
const CATS=["Alimentacao","Transporte","Hospedagem","Combustivel","Material de escritorio","Outro"];
const SC={
  "Rascunho":{bg:"var(--bg3)",tx:"var(--text2)",br:"var(--border2)"},
  "Pendente":{bg:"var(--abg)",tx:"var(--atx)",br:"var(--abr)"},
  "Aprovado Financeiro":{bg:"var(--bbg)",tx:"var(--btx)",br:"var(--bbr)"},
  "Aprovado Diretor Geral":{bg:"var(--gbg)",tx:"var(--gtx)",br:"var(--gbr)"},
  "Rejeitado":{bg:"var(--rbg)",tx:"var(--rtx)",br:"var(--rbr)"},
};

const nNF=()=>({id:Date.now()+Math.random(),cat:"",data:"",val:"",km:"",desc:"",outro:"",anexos:[],mapaNome:"",mapa:""});
const nForm=()=>({nome:"",dep:"",de:"",ate:"",pix:"",banco:"",desc:"",notas:[nNF()],_editId:null});

// Conversores e formatadores de moeda seguros
const parseMoeda = val => {
  if(val === undefined || val === null || val === "") return 0;
  if(typeof val === "number") return val;
  const s = val.toString().trim();
  if(s.includes(",")) {
    const limpo = s.replace(/\./g, "").replace(",", ".");
    return parseFloat(limpo) || 0;
  }
  return parseFloat(s) || 0;
};

const fmtMoeda = val => {
  return (parseMoeda(val)).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
};

// Máscara bancária para moeda em tempo real
const formatarMoedaInput = valorDigitado => {
  const digitos = valorDigitado.toString().replace(/\D/g, "");
  if(!digitos) return "";
  const num = (parseInt(digitos, 10) / 100).toFixed(2);
  return num.replace(".", ",");
};

// Máscara inteligente de Chave Pix (CPF, CNPJ, Celular, E-mail)
const formatarPix = valor => {
  const limpo = valor.trim();
  if(!limpo) return "";
  if(limpo.includes("@")) return limpo.toLowerCase();
  
  const apenasNumeros = limpo.replace(/\D/g, "");
  if(apenasNumeros.length === 11) {
    // Pode ser CPF ou Celular DDD + 9 dígitos
    if(["1","2","3","4","5","6","7","8","9"].includes(apenasNumeros[0])) {
      // Formata como Celular se o 3º dígito for 9
      if(apenasNumeros[2] === "9") {
        return `(${apenasNumeros.slice(0,2)}) ${apenasNumeros.slice(2,7)}-${apenasNumeros.slice(7)}`;
      }
    }
    // Formata como CPF
    return apenasNumeros.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
  } else if(apenasNumeros.length === 14) {
    // CNPJ
    return apenasNumeros.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, "$1.$2.$3/$4-$5");
  }
  return valor;
};

const fmtData = d => {
  if(!d) return "";
  try {
    const s = d.toString().split("T")[0];
    const parts = s.split("-");
    if(parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
    const dt = new Date(d);
    if(isNaN(dt)) return d;
    return dt.toLocaleDateString("pt-BR", { timeZone: "UTC" });
  } catch { return d; }
};

// Converte data ISO ou DD/MM/AAAA para YYYY-MM-DD para <input type="date">
const normalizarDataInput = d => {
  if(!d) return "";
  const s = d.toString().trim().split("T")[0];
  if(s.includes("/")) {
    const p = s.split("/");
    if(p.length === 3) {
      if(p[0].length === 4) return `${p[0]}-${p[1].padStart(2,"0")}-${p[2].padStart(2,"0")}`;
      return `${p[2]}-${p[1].padStart(2,"0")}-${p[0].padStart(2,"0")}`;
    }
  }
  return s;
};

// Formata valor salvo no banco para o formato de input monetário
const formatarValorParaInput = v => {
  if(v === undefined || v === null || v === "") return "";
  const num = parseMoeda(v);
  return num > 0 ? num.toFixed(2).replace(".", ",") : "";
};

// Extrai ID de arquivo do Google Drive
const extrairDriveId = url => {
  if(!url) return null;
  const m = url.match(/id=([a-zA-Z0-9_-]+)/);
  if(m) return m[1];
  const m2 = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if(m2) return m2[1];
  return null;
};

// Converte link do Google Drive para base64 com suporte a CORS
const urlParaBase64 = async (url) => {
  if(!url || !url.startsWith("http")) return null;
  try {
    const fileId = extrairDriveId(url);
    const fetchUrl = fileId 
      ? `https://drive.usercontent.google.com/download?id=${fileId}&export=view`
      : url;
    const r = await fetch(fetchUrl);
    if(!r.ok) return null;
    const blob = await r.blob();
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(reader.result);
      reader.onerror = () => resolve(null);
      reader.readAsDataURL(blob);
    });
  } catch(e) {
    console.warn("Falha ao converter anexo para base64:", e);
    return null;
  }
};

// Prepara as notas antes de enviar ou salvar rascunho, garantindo base64 para o Apps Script
const prepararNotasParaEnvio = async (notasRaw) => {
  return await Promise.all(notasRaw.map(async n => {
    let valor = parseMoeda(n.val);
    let descricao = n.desc || "";
    if(n.cat === "Combustivel" && n.km) {
      valor = (parseFloat(n.km || 0) * KM).toFixed(2);
      descricao = n.km + "km x R$" + KM + "/km" + (n.desc ? " - " + n.desc : "");
    } else if(n.cat === "Outro" && n.outro) {
      descricao = "[" + n.outro + "]" + (n.desc ? " - " + n.desc : "");
    }

    // Processar anexos garantindo base64
    const anexosProcessados = await Promise.all((n.anexos || []).map(async a => {
      let b64 = a.b64 || "";
      if(!b64.startsWith("data:") && a.url) {
        const conv = await urlParaBase64(a.url);
        if(conv) b64 = conv;
      }
      return {
        b64: b64,
        nome: a.nome || "anexo",
        url: a.url || ""
      };
    }));

    // Processar mapa se houver
    let mapaB64 = n.mapa || "";
    if(mapaB64.startsWith("http")) {
      const convMapa = await urlParaBase64(mapaB64);
      if(convMapa) mapaB64 = convMapa;
    }

    return {
      data: n.data,
      descricao: descricao,
      cat: n.cat,
      valor: valor,
      km: n.km || "",
      anexos: anexosProcessados,
      mapa: mapaB64,
      nomeMapa: n.mapaNome || ""
    };
  }));
};

// Configuração do Worker do PDF.js
if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

// Mecanismo Inteligente de Extração de Dados Fiscais (QR Code / OCR / PDF)
const extrairDadosTexto = (texto) => {
  if(!texto) return {};
  const res = {};
  const t = texto.replace(/\r/g, " ");

  // 1. QR Code / Chave de Acesso SEFAZ NFC-e / SAT (44 dígitos)
  const cleanT = t.replace(/\s+/g, "");
  const mChave = cleanT.match(/([0-9]{44})/);
  if(mChave) {
    const chave = mChave[1];
    res.chave = chave;
    const aamm = chave.substring(2, 6);
    res.data = `20${aamm.substring(0, 2)}-${aamm.substring(2, 4)}-01`;
    const cnpj = `${chave.substring(6, 8)}.${chave.substring(8, 11)}.${chave.substring(11, 14)}/${chave.substring(14, 18)}-${chave.substring(18, 20)}`;
    res.cnpj = cnpj;
    res.desc = `NFC-e (CNPJ: ${cnpj})`;
  }

  // 1.1 Extração de Valor em parâmetros de URL do QR Code (vNF, valor, total ou pipes)
  const mVnf = t.match(/[?&](?:vNF|valor|total)=([0-9]+[,\.][0-9]{2})/i);
  if(mVnf) {
    res.valor = mVnf[1].replace(".", ",");
  } else {
    const mPipes = t.match(/[?&]p=([^&]+)/);
    if(mPipes) {
      const partes = mPipes[1].split("|");
      for(let i = 1; i < partes.length; i++) {
        if(/^[0-9]+(?:\.[0-9]{2})$/.test(partes[i])) {
          res.valor = partes[i].replace(".", ",");
          break;
        }
      }
    } else if(t.includes("|")) {
      const mValPipe = t.match(/\|([0-9]+(?:\.[0-9]{2}))\|/);
      if(mValPipe) {
        res.valor = mValPipe[1].replace(".", ",");
      }
    }
  }

  // 2. Extração de Valor Total no Texto (OCR / PDF)
  if(!res.valor) {
    const padroesValor = [
      /(?:VALOR\s+A\s+PAGAR|TOTAL\s+A\s+PAGAR|VALOR\s+A\s+PAG|VLR\s+A\s+PAGAR|A\s+PAGAR)[:\s]*R?\$?S?\s*([0-9]+[,\.][0-9]{2})/i,
      /(?:VALOR\s+TOTAL\s+DA\s+NOTA|VALOR\s+TOTAL|VLR\s+TOTAL|TOTAL\s+LIQUIDO|TOTAL\s+GERAL)[:\s]*R?\$?S?\s*([0-9]+[,\.][0-9]{2})/i,
      /(?:T[0O]TAL\s*(?:BRUTO)?|T[0O]TAI|TOT\.)[:\s]*R?\$?S?\s*([0-9]+[,\.][0-9]{2})/i,
      /(?:CART[AÃ]O\s*(?:DE)?\s*(?:CR[EÉ]DITO|D[EÉ]BITO)?|PIX|DINHEIRO|PAGAMENTO)[:\s]*R?\$?S?\s*([0-9]+[,\.][0-9]{2})/i,
      /R\$\s*([0-9]+[,\.][0-9]{2})/i,
      /\bTOTAL[:\s]*([0-9]+[,\.][0-9]{2})\b/i
    ];
    for(const padrao of padroesValor) {
      const matches = [...t.matchAll(new RegExp(padrao, "gi"))];
      if(matches && matches.length > 0) {
        res.valor = matches[matches.length - 1][1].replace(".", ",");
        break;
      }
    }

    // Fallback: se ainda não achou, busca qualquer número monetário e seleciona o maior coerente
    if(!res.valor) {
      const todos = [...t.matchAll(/\b([0-9]{1,5}[,\.][0-9]{2})\b/g)];
      if(todos && todos.length > 0) {
        let maior = 0;
        let maiorStr = "";
        for(const v of todos) {
          const limpo = v[1].replace(".", ",");
          const p = limpo.split(",");
          const num = parseFloat(`${p[0]}.${p[1]}`);
          if(num > 0.5 && num < 50000 && num !== 2024 && num !== 2025 && num !== 2026 && num > maior) {
            maior = num;
            maiorStr = limpo;
          }
        }
        if(maiorStr) res.valor = maiorStr;
      }
    }
  }

  // 3. Extração de Data Específica DD/MM/AAAA
  const mData = t.match(/\b([0-3]?[0-9])[\/\.-]([0-1]?[0-9])[\/\.-](20[2-3][0-9]|[2-3][0-9])\b/);
  if(mData) {
    const dia = mData[1].padStart(2, "0");
    const mes = mData[2].padStart(2, "0");
    let ano = mData[3];
    if(ano.length === 2) ano = "20" + ano;
    res.data = `${ano}-${mes}-${dia}`;
  }

  // 4. Detecção Inteligente de Categoria por Palavras-Chave
  const tLow = t.toLowerCase();
  if(/restaurante|refeicao|refeicoes|almoco|jantar|lanche|lanchonete|churrascaria|pizzaria|padaria|cafe|burger|ifood|alimento|panificadora|buffet|subway|mcdonald|giraffas|spoleto|mercado|supermercado|hipermercado|atacadista|assai|carrefour|extra|pao\s*de\s*acucar|hortifruti|acougue|mercearia|sacolao/i.test(tLow)) {
    res.cat = "Alimentacao";
  } else if(/uber|99app|99\s*taxi|99tecnologia|taxi|transporte|pedagio|estacionamento|passagem|metro|onibus|sem\s*parar|conectcar|veloe|auto\s*piste|autopista|ccr|ecovias|ecorodovias|voo|latam|gol|azul|aeroporto/i.test(tLow)) {
    res.cat = "Transporte";
  } else if(/hotel|pousada|hospedagem|hostel|diaria|ibis|resort|airbnb|booking/i.test(tLow)) {
    res.cat = "Hospedagem";
  } else if(/posto|auto\s*posto|combustiveis|combustivel|gasolina|etanol|diesel|abastec|lubrificante|ipiranga|shell|petrobras|raizen|br\s*distribuidora/i.test(tLow)) {
    res.cat = "Combustivel";
  } else if(/farmacia|drogaria|droga\s*raia|drogasil|pague\s*menos|panvel|ultrafarma|medicamento/i.test(tLow)) {
    res.cat = "Outro";
    res.outro = "Farmácia / Medicamentos";
  } else if(/papelaria|kalunga|escritorio|impressao|xerox|cartucho|toner|grafica/i.test(tLow)) {
    res.cat = "Material de escritorio";
  }

  // 5. Descrição / Estabelecimento / CNPJ
  const mCnpj = t.match(/\b([0-9]{2}[\.][0-9]{3}[\.][0-9]{3}\/[0-9]{4}-[0-9]{2})\b/);
  const linhas = t.split("\n").map(l => l.trim()).filter(Boolean);
  if(linhas.length > 0) {
    const pl = linhas[0];
    if(pl.length > 3 && !pl.includes("http") && !pl.includes("www.")) {
      res.desc = pl.substring(0, 45);
    }
  }
  if(mCnpj && !res.desc) {
    res.desc = `Estabelecimento CNPJ: ${mCnpj[1]}`;
  }

  return res;
};

// Helper seguro para carregar imagem sem travar evento
const carregarImagemSegura = b64 => new Promise(resolve => {
  if(!b64) return resolve(null);
  const img = new Image();
  let resolvido = false;
  const finalizar = () => {
    if(!resolvido) {
      resolvido = true;
      resolve(img);
    }
  };
  img.onload = finalizar;
  img.onerror = () => {
    if(!resolvido) {
      resolvido = true;
      resolve(null);
    }
  };
  img.src = b64;
  if(img.complete && img.naturalWidth > 0) {
    finalizar();
  }
  // Timeout de 4s para nunca travar a Promise
  setTimeout(() => {
    if(!resolvido) {
      resolvido = true;
      resolve(img.naturalWidth > 0 ? img : null);
    }
  }, 4000);
});

// Analisador Multi-Camadas (QR Code > PDF Texto > OCR Tesseract)
const analisarComprovante = async (b64, nome) => {
  if(!b64) return null;
  const isPDF = (nome && nome.toLowerCase().endsWith(".pdf")) || b64.startsWith("data:application/pdf");
  let resultado = {};

  try {
    // CAMADA 1: Leitura de PDF nativo
    if(isPDF && window.pdfjsLib) {
      const base64Data = b64.includes(",") ? b64.split(",")[1] : b64;
      const binStr = atob(base64Data);
      const bytes = new Uint8Array(binStr.length);
      for(let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
      const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
      let textoPdf = "";
      const maxP = Math.min(pdf.numPages, 3);
      for(let p = 1; p <= maxP; p++) {
        const pag = await pdf.getPage(p);
        const tc = await pag.getTextContent();
        textoPdf += " " + tc.items.map(it => it.str).join(" ");
      }
      const dadosPdf = extrairDadosTexto(textoPdf);
      if(dadosPdf) resultado = { ...dadosPdf };
    }

    // CAMADA 2: QR Code Instantâneo com jsQR em Imagem (<30ms)
    let canvasOtimizado = null;
    if(!isPDF) {
      const img = await carregarImagemSegura(b64);
      if(img && img.width > 0 && img.height > 0) {
        // Redimensionar para tamanho ideal de leitura rápida (max 1200px)
        const maxDim = 1200;
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim) {
          if(w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        canvasOtimizado = document.createElement("canvas");
        canvasOtimizado.width = w;
        canvasOtimizado.height = h;
        const ctx = canvasOtimizado.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        const imgData = ctx.getImageData(0, 0, w, h);

        if(window.jsQR) {
          const qrCode = jsQR(imgData.data, w, h);
          if(qrCode && qrCode.data) {
            const dadosQr = extrairDadosTexto(qrCode.data);
            if(dadosQr) resultado = { ...resultado, ...dadosQr };
          }
        }
      }
    }

    // CAMADA 3: OCR Óptico com Tesseract.js (com timeout de segurança de 10s)
    if((!resultado.valor || !resultado.cat) && window.Tesseract && !isPDF && canvasOtimizado) {
      try {
        const ocrPromise = Tesseract.recognize(canvasOtimizado, 'por');
        const timeoutPromise = new Promise(resolve => setTimeout(() => resolve(null), 10000));
        const res = await Promise.race([ocrPromise, timeoutPromise]);
        if(res && res.data && res.data.text) {
          const dadosOcr = extrairDadosTexto(res.data.text);
          if(dadosOcr) {
            if(dadosOcr.valor && !resultado.valor) resultado.valor = dadosOcr.valor;
            if(dadosOcr.data && !resultado.data) resultado.data = dadosOcr.data;
            if(dadosOcr.cat && !resultado.cat) resultado.cat = dadosOcr.cat;
            if(dadosOcr.outro && !resultado.outro) resultado.outro = dadosOcr.outro;
            if(dadosOcr.desc && (!resultado.desc || resultado.desc.startsWith("NFC-e"))) {
              resultado.desc = dadosOcr.desc + (resultado.desc ? " (" + resultado.desc + ")" : "");
            }
          }
        }
      } catch(ocrErr) {
        console.warn("Aviso OCR:", ocrErr);
      }
    }
  } catch(err) {
    console.warn("Falha ao analisar comprovante:", err);
  }

  return resultado;
};

function processarArquivo(file, cb){
  if(!file){ cb(null, ""); return; }
  const nome = file.name || "anexo";
  const isPDF = file.type === "application/pdf" || nome.toLowerCase().endsWith(".pdf");

  if(isPDF && file.size > 5 * 1024 * 1024){
    alert("O arquivo PDF é muito grande. O limite máximo é de 5MB.");
    cb(null, "");
    return;
  }

  const reader = new FileReader();
  reader.onerror = () => cb(null, "");
  reader.onload = ev => {
    const result = ev.target.result;
    if(!result || result.length < 50){ cb(null, ""); return; }
    if(isPDF){ cb(result, nome); return; }
    
    const img = new Image();
    img.onerror = () => cb(result, nome);
    img.onload = () => {
      try{
        const MAX = 1200;
        let w = img.width, h = img.height;
        if(w === 0 || h === 0){ cb(result, nome); return; }
        if(w > MAX || h > MAX){
          if(w > h){ h = Math.round(h * MAX / w); w = MAX; }
          else { w = Math.round(w * MAX / h); h = MAX; }
        }
        const cv = document.createElement("canvas");
        cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        cb(cv.toDataURL("image/jpeg", 0.78), nome);
      } catch {
        cb(result, nome);
      }
    };
    img.src = result;
  };
  reader.readAsDataURL(file);
}

function AnexoBtn({label, icon, onFile, accept, capture}){
  const ref = useRef(null);
  const [proc, setProc] = useState(false);
  const handle = e => {
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    setProc(true);
    processarArquivo(f, (b64, n) => {
      setProc(false);
      if(b64) onFile(b64, n);
      else alert("Não foi possível processar o anexo. Tente outro arquivo.");
      if(ref.current) ref.current.value = "";
    });
  };
  return <label style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"10px 8px",cursor:"pointer",gap:3,background:"var(--bg)",flex:1}}>
    <span style={{fontSize:20}}>{proc ? "⏳" : icon}</span>
    <span style={{fontSize:11,color:"var(--text2)",textAlign:"center"}}>{proc ? "Processando..." : label}</span>
    <input ref={ref} type="file" accept={accept} capture={capture} style={{display:"none"}} onChange={handle}/>
  </label>;
}

    if(!emailL.trim()) {
      setMsg({ t: "err", m: "Informe o seu e-mail." });
      return;
    }
    const cleanSenha = senha.replace(/\D/g, "");
    if(!cleanSenha) {
      setMsg({ t: "err", m: "Informe sua senha de 6 números." });
      return;
    }
    if(cleanSenha.length !== 6) {
      setMsg({ t: "err", m: "A senha deve conter exatamente 6 números." });
      return;
    }
    setLoad(true); setMsg(null);
    try {
      const em = emailL.trim().toLowerCase();
      const d = await apiCall({ type: "login", email: em, senha: cleanSenha });
      if(d.primeiroAcesso) {
        setPerfilTmp(d.perfil);
        setTela("criarSenha");
        setMsg({ t: "ok", m: "Primeiro acesso identificado! Crie seu PIN de 6 números." });
      } else if(d.ok && d.perfil) {
        setUsuario(em);
        setPerfil(d.perfil);
        try {
          localStorage.setItem("user_session", JSON.stringify({ email: em, perfil: d.perfil }));
        } catch {}
        await carregar(em, d.perfil);
        setTela("lista");
      } else {
        setMsg({ t: "err", m: d.msg || d.erro || "E-mail ou senha incorretos." });
      }
    } catch {
      setMsg({ t: "err", m: "Erro de conexão com o servidor." });
    }
    setLoad(false);
  };

  const criarSenha = async () => {
    const s1 = novaSenha.replace(/\D/g, "");
    const s2 = confSenha.replace(/\D/g, "");
    if(!s1 || !s2) { setMsg({ t: "err", m: "Preencha os dois campos de senha." }); return; }
    if(s1.length !== 6) { setMsg({ t: "err", m: "A senha deve conter exatamente 6 números." }); return; }
    if(s1 !== s2) { setMsg({ t: "err", m: "As senhas não coincidem." }); return; }
    setLoad(true); setMsg(null);
    try {
      const em = emailL.trim().toLowerCase();
      const d = await apiCall({ type: "criarSenha", email: em, senha: s1 });
      if(d.ok) {
        const pf = d.perfil || perfilTmp;
        setUsuario(em); setPerfil(pf);
        try {
          localStorage.setItem("user_session", JSON.stringify({ email: em, perfil: pf }));
        } catch {}
        await carregar(em, pf);
        setTela("lista");
      } else {
        setMsg({ t: "err", m: d.msg || d.erro || "Erro ao criar senha." });
      }
    } catch {
      setMsg({ t: "err", m: "Erro de conexão." });
    }
    setLoad(false);
  };

  const solicitarCodigoReset = async () => {
    if(!emailL.trim()) {
      setMsg({ t: "err", m: "Informe o e-mail cadastrado na empresa." });
      return;
    }
    setLoad(true); setMsg(null);
    try {
      const em = emailL.trim().toLowerCase();
      const d = await apiCall({ type: "esqueciSenha", email: em });
      if(d.ok) {
        setEtapaEsqueci(2);
        setMsg({ t: "ok", m: d.msg || `Código de 6 dígitos enviado para ${em}!` });
      } else {
        setMsg({ t: "err", m: d.msg || d.erro || "E-mail não encontrado ou inativo." });
      }
    } catch {
      setMsg({ t: "err", m: "Erro de conexão ao solicitar recuperação de senha." });
    }
    setLoad(false);
  };

  const redefinirSenha = async () => {
    const cod = codigoReset.replace(/\D/g, "");
    const s1 = novaSenhaReset.replace(/\D/g, "");
    const s2 = confSenhaReset.replace(/\D/g, "");

    if(!cod || cod.length !== 6) {
      setMsg({ t: "err", m: "Informe o código de verificação de 6 números." });
      return;
    }
    if(!s1 || !s2) {
      setMsg({ t: "err", m: "Preencha a nova senha e a confirmação." });
      return;
    }
    if(s1.length !== 6) {
      setMsg({ t: "err", m: "A nova senha deve conter exatamente 6 números." });
      return;
    }
    if(s1 !== s2) {
      setMsg({ t: "err", m: "As senhas não coincidem." });
      return;
    }

    setLoad(true); setMsg(null);
    try {
      const em = emailL.trim().toLowerCase();
      const d = await apiCall({
        type: "redefinirSenha",
        email: em,
        codigo: cod,
        senha: s1
      });
      if(d.ok) {
        if(d.perfil) {
          setUsuario(em);
          setPerfil(d.perfil);
          try {
            localStorage.setItem("user_session", JSON.stringify({ email: em, perfil: d.perfil }));
          } catch {}
          await carregar(em, d.perfil);
          setTela("lista");
          setMsg({ t: "ok", m: "Senha redefinida com sucesso! Bem-vindo(a)." });
        } else {
          setSenha("");
          setTela("login");
          setMsg({ t: "ok", m: "Senha redefinida com sucesso! Digite sua nova senha de 6 números para entrar." });
        }
        setCodigoReset("");
        setNovaSenhaReset("");
        setConfSenhaReset("");
        setEtapaEsqueci(1);
      } else {
        setMsg({ t: "err", m: d.msg || d.erro || "Código de verificação incorreto ou expirado." });
      }
    } catch {
      setMsg({ t: "err", m: "Erro de conexão ao redefinir senha." });
    }
    setLoad(false);
  };

  const updNota = (idOuIdx, c, v) => setForm(f => ({
    ...f,
    notas: f.notas.map((n, i) => (n.id === idOuIdx || i === idOuIdx) ? { ...n, [c]: v } : n)
  }));

  const updNotaCampos = (idOuIdx, campos) => setForm(f => ({
    ...f,
    notas: f.notas.map((n, i) => (n.id === idOuIdx || i === idOuIdx) ? { ...n, ...campos } : n)
  }));

  const total = useMemo(() => {
    return form.notas.reduce((s, n) => {
      if(n.cat === "Combustivel" && n.km) return s + (parseFloat(n.km) || 0) * KM;
      return s + parseMoeda(n.val);
    }, 0);
  }, [form.notas]);

  const validar = () => {
    const e = {};
    if(!form.nome.trim()) e.nome = true;
    if(!form.dep.trim()) e.dep = true;
    if(!form.de) e.de = true;
    if(!form.ate) e.ate = true;
    if(!form.pix.trim()) e.pix = true;
    if(!form.banco.trim()) e.banco = true;
    if(!form.desc.trim()) e.desc = true;
    setErros(e);
    if(Object.keys(e).length > 0) return false;

    // Validação de integridade das notas
    const notaSemCat = form.notas.some(n => !n.cat);
    if(notaSemCat) {
      setMsg({ t: "err", m: "Selecione a categoria de todas as notas fiscais." });
      return false;
    }
    const notaSemValor = form.notas.some(n => {
      if(n.cat === "Combustivel") return !n.km || parseFloat(n.km) <= 0;
      return parseMoeda(n.val) <= 0;
    });
    if(notaSemValor) {
      setMsg({ t: "err", m: "Informe o valor ou a quilometragem de todas as notas fiscais." });
      return false;
    }
    return true;
  };

  // Preenchimento rápido de período (Mês Atual)
  const aplicarPeriodoMesAtual = () => {
    const hoje = new Date();
    const ano = hoje.getFullYear();
    const mes = String(hoje.getMonth() + 1).padStart(2, "0");
    const de = `${ano}-${mes}-01`;
    const ate = hoje.toISOString().split("T")[0];
    setForm(f => ({ ...f, de, ate }));
  };

  // SALVAR RASCUNHO
  const salvarRascunho = async () => {
    if(!form.nome.trim()) { setMsg({ t: "err", m: "Preencha o nome para salvar o rascunho." }); return; }
    setLoad(true); setMsg(null);
    try {
      const notas = await prepararNotasParaEnvio(form.notas);
      const cats = [...new Set(notas.map(n => n.cat).filter(Boolean))].join(", ");
      
      if(form._editId) {
        const userEmail = (usuario || "").trim().toLowerCase();
        await apiCall({ type: "excluir", id: form._editId, email: userEmail });
      }

      const d = await apiCall({
        type: "rascunho", nome: form.nome, email: usuario,
        departamento: form.dep, periodoInicio: form.de, periodoFim: form.ate,
        chavePix: form.pix, banco: form.banco, descricao: form.desc,
        categoria: cats, notas, valorTotal: total.toFixed(2)
      });

      if(d.ok) {
        try { localStorage.removeItem("reembolso_local_draft"); } catch {}
        setMsg({ t: "ok", m: "Rascunho salvo com sucesso! ID: " + d.id });
        setForm(nForm());
        await carregar(usuario, perfil);
        setTela("lista");
      } else {
        setMsg({ t: "err", m: "Erro: " + (d.msg || "Tente novamente") });
      }
    } catch(err) {
      setMsg({ t: "err", m: "Erro: " + err.message });
    }
    setLoad(false);
  };

  // EXCLUIR SOLICITACAO OU RASCUNHO
  const excluir = async id => {
    if(!id) return;
    if(!window.confirm("Confirma a exclusão definitiva deste rascunho/solicitação?")) return;
    setLoad(true);
    try {
      const userEmail = (usuario || "").trim().toLowerCase();
      const d = await apiCall({ type: "excluir", id, email: userEmail });
      if(d && (d.ok || d.status === "ok" || d.success)) {
        setMsg({ t: "ok", m: "Solicitação/rascunho excluído com sucesso." });
        try { localStorage.removeItem("reembolso_local_draft"); } catch {}
        setForm(nForm());
        await carregar(usuario, perfil);
        setTela("lista");
      } else {
        setMsg({ t: "err", m: (d && d.msg) ? d.msg : "Não foi possível excluir no servidor." });
        await carregar(usuario, perfil);
      }
    } catch(err) {
      setMsg({ t: "err", m: "Erro: " + err.message });
    }
    setLoad(false);
  };

  // ENVIO UNIFICADO
  const enviar = async () => {
    if(!validar()) return;
    setLoad(true); setMsg(null);
    try {
      const notas = await prepararNotasParaEnvio(form.notas);
      const cats = [...new Set(notas.map(n => n.cat).filter(Boolean))].join(", ");

      if(form._editId) {
        await apiCall({ type: "excluir", id: form._editId, email: usuario });
      }

      const d = await apiCall({
        type: "solicitacao",
        nome: form.nome, email: usuario, departamento: form.dep,
        periodoInicio: form.de, periodoFim: form.ate,
        chavePix: form.pix, banco: form.banco, descricao: form.desc,
        categoria: cats, notas: notas, valorTotal: total.toFixed(2)
      });

      if(d.ok) {
        try { localStorage.removeItem("reembolso_local_draft"); } catch {}
        setMsg({ t: "ok", m: "Solicitação enviada com sucesso! ID: " + d.id });
        setForm(nForm());
        await carregar(usuario, perfil);
        setTela("lista");
      } else {
        setMsg({ t: "err", m: "Erro: " + (d.msg || d.erro || "Tente novamente") });
      }
    } catch(err) {
      setMsg({ t: "err", m: "Erro: " + err.message });
    }
    setLoad(false);
  };

  // APROVAR OU REJEITAR (COM JUSTIFICATIVA OBRIGATÓRIA NA REJEIÇÃO)
  const aprovar = async (id, acao) => {
    if(acao === "rejeitar" && !coment.trim()) {
      alert("⚠️ AVISO: É obrigatório informar o motivo da rejeição no campo de comentário para orientar o colaborador.");
      return;
    }

    setLoad(true); setMsg(null);
    try {
      const tipo = acao === "aprovar"
        ? (perfil === "Financeiro" ? "aprovarFinanceiro" : "aprovarDiretor")
        : (perfil === "Financeiro" ? "rejeitarFinanceiro" : "rejeitarDiretor");
      const d = await apiCall({ type: tipo, id, aprovador: usuario, comentario: coment });
      if(d.ok) {
        setMsg({ t: "ok", m: acao === "aprovar" ? "Solicitação aprovada!" : "Solicitação rejeitada com justificativa enviada." });
        setComent("");
        await carregar(usuario, perfil);
        setTela("lista");
      } else {
        setMsg({ t: "err", m: d.msg || "Erro ao processar." });
      }
    } catch {
      setMsg({ t: "err", m: "Erro de conexão." });
    }
    setLoad(false);
  };

  // EXPORTAR RELATÓRIO CSV / EXCEL
  const exportarCSV = () => {
    if(solsFiltradas.length === 0) {
      alert("Nenhum dado disponível para exportar no filtro atual.");
      return;
    }
    const cabecalho = ["ID_Solicitacao","Nome_Colaborador","Departamento","Status","Categoria","Periodo_Inicio","Periodo_Fim","Banco","Chave_Pix","Valor_Total","Comentario_Financeiro","Comentario_Diretor"];
    const linhas = solsFiltradas.map(s => [
      `"${s.ID_Solicitacao || ""}"`,
      `"${(s.Nome_Colaborador || "").replace(/"/g, '""')}"`,
      `"${s.Departamento || ""}"`,
      `"${s.Status || ""}"`,
      `"${s.Categoria || ""}"`,
      `"${fmtData(s.Periodo_Inicio)}"`,
      `"${fmtData(s.Periodo_Fim)}"`,
      `"${s.Banco || ""}"`,
      `"${s.Chave_Pix || ""}"`,
      `"${(s.Valor_Total || "0").toString().replace(".", ",")}"`,
      `"${(s.Comentario_Gestor || "").replace(/"/g, '""')}"`,
      `"${(s.Comentario_RH || "").replace(/"/g, '""')}"`
    ]);

    const csvContent = "\uFEFF" + [cabecalho.join(";"), ...linhas.map(e => e.join(";"))].join("\r\n");
    const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.setAttribute("href", url);
    link.setAttribute("download", `reembolsos_servi_${new Date().toISOString().slice(0,10)}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  };

  const goBack = () => {
    if(tela === "form") {
      if(!window.confirm("Deseja sair? Dados não salvos serão mantidos como rascunho temporário.")) return;
    }
    setTela("lista"); setDet(null); setErros({}); setMsg(null);
  };

  const goSair = () => {
    if(window.confirm("Deseja realmente sair da sua conta?")) {
      try { localStorage.removeItem("user_session"); } catch {}
      setUsuario(null); setPerfil(null); setSenha(""); setEmailL("");
      setNovaSenha(""); setConfSenha("");
      setCodigoReset(""); setNovaSenhaReset(""); setConfSenhaReset(""); setEtapaEsqueci(1);
      setTela("login"); setMsg(null);
    }
  };

  const goAjuda = () => { setTelaAnterior(tela); setTela("ajuda"); setMsg(null); };
  const hdr = { dark, onDark: () => setDark(v => !v), onAjuda: goAjuda };

  // Filtro de lista
  const solsFiltradas = useMemo(() => {
    return sols.filter(s => {
      const matchFiltro = filtroStatus === "Todos" 
        || (filtroStatus === "Pendentes" && (s.Status === "Pendente" || s.Status === "Aprovado Financeiro"))
        || (filtroStatus === "Aprovados" && s.Status === "Aprovado Diretor Geral")
        || (filtroStatus === "Rascunhos" && s.Status === "Rascunho");

      const matchBusca = !busca.trim()
        || (s.Nome_Colaborador || "").toLowerCase().includes(busca.toLowerCase())
        || (s.ID_Solicitacao || "").toLowerCase().includes(busca.toLowerCase())
        || (s.Departamento || "").toLowerCase().includes(busca.toLowerCase());

      return matchFiltro && matchBusca;
    });
  }, [sols, filtroStatus, busca]);

  // Cálculos de KPIs / Mini-Dashboard
  const kpis = useMemo(() => {
    const pendentes = sols.filter(s => s.Status === "Pendente" || s.Status === "Aprovado Financeiro");
    const aprovados = sols.filter(s => s.Status === "Aprovado Diretor Geral");
    const valPend = pendentes.reduce((acc, s) => acc + parseMoeda(s.Valor_Total), 0);
    const valAprov = aprovados.reduce((acc, s) => acc + parseMoeda(s.Valor_Total), 0);
    const totalKm = sols.reduce((acc, s) => acc + (s.notas || []).reduce((nAcc, n) => nAcc + (parseFloat(n.km) || 0), 0), 0);

    return {
      qtdPend: pendentes.length,
      valPend,
      qtdAprov: aprovados.length,
      valAprov,
      totalKm
    };
  }, [sols]);

  if(tela === "login" || tela === "criarSenha" || tela === "esqueciSenha") return <>
    <Hdr tela={tela} perfil={null} {...hdr} onAjuda={()=>{}}/>
    <div style={{minHeight:"calc(100vh - 56px)",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--bg2)",padding:"1rem"}}>
      <div style={{background:"var(--bg)",borderRadius:20,padding:"2rem",width:"100%",maxWidth:380,border:"1px solid var(--border)",boxShadow:"0 4px 32px rgba(0,0,0,0.1)"}}>
        <div style={{textAlign:"center",marginBottom:24}}>
          <img src={LOGO} alt="Logo" style={{height:44,objectFit:"contain",marginBottom:10}} onError={e=>e.target.style.display="none"}/>
          <p style={{fontSize:13,color:"var(--text2)"}}>
            {tela==="criarSenha" ? "Crie seu PIN de 6 números" : (tela==="esqueciSenha" ? "Recuperação de Acesso" : "Sistema de Reembolso")}
          </p>
        </div>

        {tela === "login" && <>
          <label style={L}>E-mail</label>
          <input 
            style={{...I(false),marginBottom:14}} 
            value={emailL} 
            onChange={e=>setEmailL(e.target.value)} 
            placeholder="seu@email.com" 
            type="email" 
            autoComplete="email"
          />
          
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5}}>
            <label style={{...L,marginBottom:0}}>Senha (6 números)</label>
            <button 
              type="button" 
              onClick={()=>{ setMsg(null); setEtapaEsqueci(1); setTela("esqueciSenha"); }} 
              style={{background:"none",border:"none",color:"var(--primary)",fontSize:12,cursor:"pointer",fontWeight:500,padding:0}}
            >
              Esqueci a senha
            </button>
          </div>
          <div style={{position:"relative",marginBottom:16}}>
            <input 
              style={{...I(false),paddingRight:44,letterSpacing:senha?"4px":"normal",fontWeight:senha?"600":"normal"}} 
              value={senha} 
              onChange={e=>setSenha(e.target.value.replace(/\D/g,"").slice(0,6))} 
              placeholder="000000" 
              type={showPwd?"text":"password"} 
              inputMode="numeric" 
              pattern="[0-9]*" 
              maxLength={6} 
              onKeyDown={e=>e.key==="Enter"&&login()} 
              autoComplete="current-password"
            />
            <button 
              type="button" 
              onClick={()=>setShowPwd(v=>!v)} 
              style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",fontSize:12,color:"var(--text2)"}}
            >
              {showPwd?"ocultar":"ver"}
            </button>
          </div>
          <Alerta msg={msg}/>
          <button 
            style={{width:"100%",padding:13,fontSize:15,fontWeight:600,border:"none",borderRadius:10,background:"var(--primary)",color:"#fff",cursor:"pointer"}} 
            onClick={login} 
            disabled={load}
          >
            {load?"Entrando...":"Entrar"}
          </button>
          <p style={{fontSize:12,color:"var(--text3)",marginTop:14,textAlign:"center",lineHeight:1.4}}>
            🔒 Acesso via PIN de 6 dígitos numéricos.<br/>No primeiro acesso você definirá sua senha.
          </p>
        </>}

        {tela === "criarSenha" && <>
          <div style={{background:"var(--abg)",border:"1px solid var(--abr)",borderRadius:10,padding:"10px 14px",marginBottom:16,fontSize:13,color:"var(--atx)"}}>
            ✨ <strong>Primeiro acesso!</strong> Crie um PIN de acesso de <strong>6 números</strong> (ex: 123456).
          </div>
          <label style={L}>Novo PIN numérico (6 dígitos)</label>
          <input 
            style={{...I(false),marginBottom:14,letterSpacing:novaSenha?"4px":"normal",fontWeight:novaSenha?"600":"normal"}} 
            value={novaSenha} 
            onChange={e=>setNovaSenha(e.target.value.replace(/\D/g,"").slice(0,6))} 
            placeholder="000000" 
            type="password" 
            inputMode="numeric" 
            pattern="[0-9]*" 
            maxLength={6} 
            autoComplete="new-password"
          />
          <label style={L}>Confirmar novo PIN</label>
          <input 
            style={{...I(false),marginBottom:16,letterSpacing:confSenha?"4px":"normal",fontWeight:confSenha?"600":"normal"}} 
            value={confSenha} 
            onChange={e=>setConfSenha(e.target.value.replace(/\D/g,"").slice(0,6))} 
            placeholder="Repita os 6 números" 
            type="password" 
            inputMode="numeric" 
            pattern="[0-9]*" 
            maxLength={6} 
            onKeyDown={e=>e.key==="Enter"&&criarSenha()} 
            autoComplete="new-password"
          />
          <Alerta msg={msg}/>
          <button 
            style={{width:"100%",padding:13,fontSize:15,fontWeight:600,border:"none",borderRadius:10,background:"var(--primary)",color:"#fff",cursor:"pointer"}} 
            onClick={criarSenha} 
            disabled={load}
          >
            {load?"Salvando...":"Criar senha e entrar"}
          </button>
          <button 
            type="button" 
            onClick={()=>{ setMsg(null); setTela("login"); }} 
            style={{width:"100%",background:"none",border:"none",color:"var(--text2)",fontSize:13,marginTop:12,cursor:"pointer"}}
          >
            ← Voltar ao login
          </button>
        </>}

        {tela === "esqueciSenha" && <>
          {etapaEsqueci === 1 ? <>
            <div style={{background:"var(--bbg)",border:"1px solid var(--bbr)",borderRadius:10,padding:"10px 14px",marginBottom:16,fontSize:13,color:"var(--btx)"}}>
              🔑 <strong>Esqueceu sua senha?</strong><br/>
              Digite seu e-mail cadastrado. Enviaremos um <strong>código de 6 dígitos</strong> para você redefinir seu PIN.
            </div>
            <label style={L}>E-mail cadastrado</label>
            <input 
              style={{...I(false),marginBottom:16}} 
              value={emailL} 
              onChange={e=>setEmailL(e.target.value)} 
              placeholder="seu@email.com" 
              type="email" 
              autoComplete="email" 
              onKeyDown={e=>e.key==="Enter"&&solicitarCodigoReset()}
            />
            <Alerta msg={msg}/>
            <button 
              style={{width:"100%",padding:13,fontSize:15,fontWeight:600,border:"none",borderRadius:10,background:"var(--primary)",color:"#fff",cursor:"pointer"}} 
              onClick={solicitarCodigoReset} 
              disabled={load}
            >
              {load?"Enviando código...":"📨 Enviar código de recuperação"}
            </button>
            <button

              inputMode="numeric" 
              pattern="[0-9]*" 
              maxLength={6}

            <label style={L}>Confirmar nova senha (6 números)</label>

              type={showPwdReset?"text":"password"} 
              inputMode="numeric" 
              pattern="[0-9]*" 
              maxLength={6}

            <div style={{display:"flex",justifyContent:"center",alignItems:"center",marginTop:14}}>
              <button 
                type="button"

                disabled={load}

              </button>
            </div>
            <button 
              type="button" 
              onClick={()=>{ setMsg(null); setTela("login"); }} 
              style={{width:"100%",background:"none",border:"none",color:"var(--text2)",fontSize:13,marginTop:12,cursor:"pointer"}}
            >
              ← Voltar ao login
            </button>
          </>}
        </>}
      </div>
    </div>
  </>;

  return <div style={{background:"var(--bg2)",minHeight:"100vh"}}>
    <Hdr tela={tela} onBack={goBack} perfil={perfil} onSair={goSair} {...hdr}/>
    <div style={{maxWidth:600,margin:"0 auto",padding:"1rem 1rem 5rem"}}>
      <Alerta msg={msg}/>

      {/* MODAL / LIGHTBOX DE ZOOM DE IMAGEM */}

            <span style={{fontSize:12,color:"var(--btx)"}}>Abrir →</span>

          <a href="https://docs.google.com/forms/d/e/1FAIpQLSfKGuzFPSp65xq2JA4eyVshxbkfJt-B8OsEgwfmq-1g-6BiTQ/viewform" target="_blank" style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",textDecoration:"none"}}>
            <span style={{fontSize:13,color:"var(--text)"}}>📝 Cadastrar Novo Prestador</span>
            <span style={{fontSize:12,color:"var(--btx)"}}>Abrir →</span>
          </a>

            <span style={{fontSize:20}}>{p.icon}</span>
            <div><p style={{fontWeight:600,fontSize:13,color:"var(--text)"}}>{p.nome}</p><p style={{fontSize:12,color:"var(--text2)"}}>{p.desc}</p></div>
          </div>)}
        </div>

        <div className="card" style={{marginBottom:12}}>
          <p style={{fontWeight:600,fontSize:14,marginBottom:10,color:"var(--text)"}}>📋 Como enviar um reembolso</p>
          {[
            {n:"1",t:"Clique em '+ Nova solicitação'",d:"Preencha nome, departamento, período, banco e chave Pix."},
            {n:"2",t:"Adicione as notas fiscais",d:"Selecione categoria, data, valor e anexe foto ou PDF de cada NF."},
            {n:"3",t:"Salve ou envie",d:"Use Rascunho para continuar depois ou Enviar para submeter agora."},
            {n:"4",t:"Acompanhe o status",d:"Veja na lista: Rascunho, Pendente, Aprovado Financeiro, Aprovado Diretor Geral ou Rejeitado."},
          ].map((s,i)=><div key={i} style={{display:"flex",gap:12,padding:"8px 0",borderBottom:i<3?"0.5px solid var(--border)":"none",alignItems:"flex-start"}}>
            <span style={{background:"var(--primary-lt)",color:"var(--primary)",width:24,height:24,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:12,flexShrink:0,marginTop:2}}>{s.n}</span>
            <div><p style={{fontWeight:600,fontSize:13,color:"var(--text)"}}>{s.t}</p><p style={{fontSize:12,color:"var(--text2)"}}>{s.d}</p></div>

      {tela === "detalhe" && det && (() => {

        const pFinanceiro = perfil === "Financeiro" && sv.Status === "Pendente";
        const pDiretor = perfil === "Diretor Geral" && sv.Status === "Aprovado Financeiro";

        return <div style={{paddingTop:4}}>
          <div className="card">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>

                <p style={{fontWeight:700,fontSize:16,color:"var(--text)"}}>{sv.Nome_Colaborador}</p>

              ["Período", fmtData(sv.Periodo_Inicio) + " - " + fmtData(sv.Periodo_Fim)],
              ["Categorias", sv.Categoria],
              ["Chave Pix", sv.Chave_Pix],
              ["Banco", sv.Banco],
              ["Descrição", sv.Descricao_Reembolso]
            ].map(([k, v]) => v ? (
              <div key={k} style={{display:"flex",justifyContent:"space-between",fontSize:13,padding:"8px 0",borderBottom:"0.5px solid var(--border)"}}>
                <span style={{color:"var(--text2)",fontWeight:500}}>{k}</span>
                <span style={{maxWidth:"55%",textAlign:"right",color:"var(--text)"}}>{v}</span>
              </div>
            ) : null)}
            <div style={{display:"flex",justifyContent:"space-between",padding:"12px 0 0"}}>
              <span style={{fontWeight:600,color:"var(--text)"}}>Total</span>
              <span style={{fontWeight:700,fontSize:20,color:"var(--primary)"}}>R$ {fmtMoeda(sv.Valor_Total)}</span>
            </div>
          </div>

          <p style={{fontWeight:600,fontSize:14,margin:"4px 0 10px",color:"var(--text)"}}>Notas fiscais</p>
          {(sv.notas || []).map((nf, i) => {
            const links = (nf.Anexo_NF || "").toString().split("|").filter(l => l.startsWith("http"));
            const mapaLink = (nf.Mapa_NF || "").toString();
            const catExibicao = nf.Categoria || (CATS.includes(nf.Mapa_NF) ? nf.Mapa_NF : "");
            return <div key={i} className="card">
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                <span style={{fontSize:13,fontWeight:600,color:"var(--text)"}}>NF {i+1}{catExibicao ? " - " + catExibicao : ""}</span>
                <span style={{fontWeight:700,color:"var(--primary)"}}>R$ {fmtMoeda(nf.Valor_NF)}</span>
              </div>
              <p style={{fontSize:12,color:"var(--text2)",marginBottom:8}}>{fmtData(nf.Data_NF)}{nf.Descricao_NF ? " - " + nf.Descricao_NF : ""}</p>
              
              {links.length > 0 ? (
                <div style={{marginBottom:6}}>
                  {links.map((link, li) => {
                    const isViewable = link.includes("drive.google.com") || link.endsWith(".jpg") || link.endsWith(".png") || link.endsWith(".jpeg");
                    return (
                      <div key={li} style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:4}}>
                        <button type="button" onClick={()=>setModalImg({ src: link.replace("export=download","export=view"), nome: `Anexo ${li+1} - NF ${i+1}` })} style={{display:"inline-flex",alignItems:"center",gap:6,fontSize:12,color:"var(--btx)",fontWeight:500,padding:"6px 10px",border:"1px solid var(--bbr)",borderRadius:8,background:"var(--bbg)",cursor:"pointer"}}>
                          👁️ Ampliar anexo {li+1}
                        </button>
                        <a href={link.replace("export=view","export=download")} target="_blank" rel="noreferrer" style={{display:"inline-flex",alignItems:"center",gap:6,fontSize:12,color:"var(--btx)",textDecoration:"none",fontWeight:500,padding:"6px 10px",border:"1px solid var(--bbr)",borderRadius:8,background:"var(--bbg)"}}>
                          ⬇️ Baixar {li+1}
                        </a>
                      </div>
                    );
                  })}
                </div>
              ) : (
                <p style={{fontSize:12,color:"var(--text3)",fontStyle:"italic",marginBottom:6}}>Sem anexo</p>
              )}

              {mapaLink.startsWith("http") && <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:4}}>
                <button type="button" onClick={()=>setModalImg({ src: mapaLink.replace("export=download","export=view"), nome: `Rota NF ${i+1}` })} style={{display:"inline-flex",alignItems:"center",gap:6,fontSize:12,color:"var(--otx)",fontWeight:500,padding:"6px 10px",border:"1px solid var(--obr)",borderRadius:8,background:"var(--obg)",cursor:"pointer"}}>
                  🗺️ Ampliar rota
                </button>
                <a href={mapaLink.replace("export=view","export=download")} target="_blank" rel="noreferrer" style={{display:"inline-flex",alignItems:"center",gap:6,fontSize:12,color:"var(--otx)",textDecoration:"none",fontWeight:500,padding:"6px 10px",border:"1px solid var(--obr)",borderRadius:8,background:"var(--obg)"}}>
                  ⬇️ Baixar rota
                </a>
              </div>}
            </div>;
          })}

          {/* AÇÕES DE PRESTADOR / RASCUNHO */}
          {(perfil === "Prestador" || sv.Status === "Rascunho") && (sv.Status === "Rascunho" || sv.Status === "Pendente") && <div className="card">
            <div style={{display:"grid",gridTemplateColumns:sv.Status==="Rascunho"?"1fr 1fr":"1fr",gap:12}}>
              {sv.Status === "Rascunho" && <button onClick={() => {
                const notasMapeadas = (sv.notas || []).length > 0 ? (sv.notas || []).map((n, nIdx) => {
                  let cat = n.Categoria || "";
                  if(!cat && CATS.includes(n.Mapa_NF)) cat = n.Mapa_NF;
                  if(!cat && n.cat && CATS.includes(n.cat)) cat = n.cat;

                  let desc = n.Descricao_NF || n.desc || "";
                  let outro = "";
                  let km = n.km || "";

                  if(cat === "Outro") {
                    const matchOutro = desc.match(/^\[(.*?)\]\s*(.*)$/);
                    if(matchOutro) {
                      outro = matchOutro[1];
                      desc = matchOutro[2];
                    }
                  } else if(cat === "Combustivel") {
                    const matchKm = desc.match(/^(\d+(?:[\.,]\d+)?)km x R\$[\d\.,]+\/km\s*(- )?(.*)$/i);
                    if(matchKm) {
                      km = matchKm[1].replace(",", ".");
                      desc = matchKm[3] || "";
                    }
                  }

                  const valStr = formatarValorParaInput(n.Valor_NF !== undefined ? n.Valor_NF : n.val);
                  const dataStr = normalizarDataInput(n.Data_NF || n.data);

                  const links = (n.links && n.links.length > 0)
                    ? n.links
                    : (n.Anexo_NF || "").toString().split("|").filter(x => x.startsWith("http"));

                  const anexos = links.map((url, uidx) => ({
                    id: "saved_" + uidx + "_" + Date.now(),
                    b64: "",
                    url: url,
                    nome: `Comprovante ${uidx + 1} (Salvo)`
                  }));

                  let mapa = "";
                  let mapaNome = "";
                  if(n.Mapa_NF && n.Mapa_NF.startsWith("http")) {
                    mapa = n.Mapa_NF;
                    mapaNome = "Comprovante de rota salvo";
                  }

                  return {
                    id: Date.now() + Math.random() + nIdx,
                    cat,
                    data: dataStr,
                    val: valStr,
                    km,
                    desc,
                    outro,
                    anexos,
                    mapa,
                    mapaNome
                  };
                }) : [nNF()];

                setForm({
                  nome: sv.Nome_Colaborador || "",
                  dep: sv.Departamento || "",
                  de: normalizarDataInput(sv.Periodo_Inicio),
                  ate: normalizarDataInput(sv.Periodo_Fim),
                  pix: sv.Chave_Pix ? sv.Chave_Pix.toString() : "",
                  banco: sv.Banco || "",
                  desc: sv.Descricao_Reembolso || "",
                  notas: notasMapeadas,
                  _editId: sv.ID_Solicitacao
                });

                // Carrega miniaturas dos anexos em background
                notasMapeadas.forEach(nota => {
                  (nota.anexos || []).forEach(async a => {
                    if(a.url) {
                      const b64 = await urlParaBase64(a.url);
                      if(b64) {
                        setForm(prev => ({
                          ...prev,
                          notas: (prev.notas || []).map(item => ({
                            ...item,
                            anexos: (item.anexos || []).map(anx => anx.url === a.url ? { ...anx, b64 } : anx)
                          }))
                        }));
                      }
                    }
                  });
                  if(nota.mapa && nota.mapa.startsWith("http")) {
                    urlParaBase64(nota.mapa).then(b64 => {
                      if(b64) {
                        setForm(prev => ({
                          ...prev,
                          notas: (prev.notas || []).map(item => item.mapa === nota.mapa ? { ...item, mapa: b64 } : item)
                        }));
                      }
                    });
                  }
                });

                setTela("form");
                setMsg({ t: "ok", m: "Rascunho aberto para edição! Seus comprovantes anteriores foram recuperados." });
              }} style={{padding:13,borderRadius:10,border:"1px solid var(--bbr)",background:"var(--bbg)",color:"var(--btx)",cursor:"pointer",fontWeight:600,fontSize:14}}>✏️ Editar rascunho</button>}
              <button onClick={()=>excluir(sv.ID_Solicitacao)} disabled={load} style={{padding:13,borderRadius:10,border:"1px solid var(--rbr)",background:"var(--rbg)",color:"var(--rtx)",cursor:"pointer",fontWeight:600,fontSize:14}}>🗑️ Excluir</button>
            </div>
          </div>}

          {sv.Status === "Rascunho" && <div className="card">
            <button onClick={async () => {
              if(!window.confirm("Enviar esta solicitação para aprovação?")) return;
              setLoad(true);
              const d = await apiCall({ type: "enviarRascunho", id: sv.ID_Solicitacao });
              if(d.ok) {
                setMsg({ t: "ok", m: "Enviado para aprovação!" });
                await carregar(usuario, perfil);
                setTela("lista");
              } else {
                setMsg({ t: "err", m: d.msg || "Erro ao enviar." });
              }
              setLoad(false);
            }} disabled={load} style={{width:"100%",padding:14,borderRadius:10,border:"none",background:"var(--primary)",color:"#fff",cursor:"pointer",fontWeight:600,fontSize:15}}>
              🚀 Enviar para aprovação
            </button>
          </div>}

          {sv.Comentario_Gestor && <div className="card" style={{borderLeft:"3px solid var(--bbr)",borderRadius:"0 14px 14px 0"}}>
            <p style={{fontSize:12,color:"var(--text2)",fontWeight:500}}>Comentário Financeiro</p>
            <p style={{fontSize:13,marginTop:4,color:"var(--text)"}}>{sv.Comentario_Gestor}</p>
          </div>}
          {sv.Comentario_RH && <div className="card" style={{borderLeft:"3px solid var(--gbr)",borderRadius:"0 14px 14px 0"}}>
            <p style={{fontSize:12,color:"var(--text2)",fontWeight:500}}>Comentário Diretor Geral</p>
            <p style={{fontSize:13,marginTop:4,color:"var(--text)"}}>{sv.Comentario_RH}</p>
          </div>}

          {/* COMPROVANTE OFICIAL EM PDF */}
          {(sv.Status === "Aprovado Diretor Geral" || sv.Comprovante_PDF) && <div className="card" style={{borderLeft:"4px solid #10b981",background:"var(--card)"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:12}}>
              <div>
                <p style={{fontWeight:700,fontSize:14,color:"var(--text)",display:"flex",alignItems:"center",gap:6}}>
                  <span>📄</span> Comprovante Oficial de Aprovação
                </p>
                <p style={{fontSize:12,color:"var(--text2)",marginTop:2}}>
                  Relatório com assinaturas digitais, dados bancários/Pix e resumo das notas para pagamento e auditoria.
                </p>
              </div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                {sv.Comprovante_PDF ? (
                  <a href={sv.Comprovante_PDF} target="_blank" rel="noreferrer" style={{display:"inline-flex",alignItems:"center",gap:6,fontSize:13,padding:"10px 16px",borderRadius:8,background:"#059669",color:"#fff",textDecoration:"none",fontWeight:600}}>
                    📥 Baixar Comprovante (PDF)
                  </a>
                ) : (
                  <button type="button" onClick={async () => {
                    setGerandoPdf(sv.ID_Solicitacao);
                    try {
                      const res = await apiCall({ type: "gerarPdf", id: sv.ID_Solicitacao });
                      if(res && res.ok && res.pdfUrl) {
                        window.open(res.pdfUrl, "_blank");
                        await carregar(usuario, perfil);
                      } else {
                        alert("Erro ao gerar PDF: " + (res && res.msg ? res.msg : "Tente novamente."));
                      }
                    } catch(err) {
                      alert("Erro na conexão: " + err.message);
                    }
                    setGerandoPdf(null);
                  }} disabled={gerandoPdf === sv.ID_Solicitacao} style={{display:"inline-flex",alignItems:"center",gap:6,fontSize:13,padding:"10px 16px",borderRadius:8,background:"#059669",color:"#fff",border:"none",cursor:"pointer",fontWeight:600}}>
                    {gerandoPdf === sv.ID_Solicitacao ? "⏳ Gerando PDF..." : "📄 Gerar Comprovante (PDF)"}
                  </button>
                )}
              </div>
            </div>
          </div>}

          {/* AÇÕES DE GESTÃO (Financeiro / Diretor) */}
          {(pFinanceiro || pDiretor) && <div className="card" style={{borderTop:"3px solid var(--primary)",borderRadius:"0 0 14px 14px"}}>
            <p style={{fontWeight:600,fontSize:15,marginBottom:12,color:"var(--text)"}}>{pFinanceiro?"Aprovação Financeiro":"Aprovação Diretor Geral"}</p>
            <div style={{marginBottom:14}}>
              <label style={L}>Comentário / Justificativa {pFinanceiro || pDiretor ? "(Obrigatório se rejeitar)" : ""}</label>
              <textarea value={coment} onChange={e=>setComent(e.target.value)} placeholder="Digite observações para aprovação ou o motivo detalhado caso vá rejeitar..." rows={3} style={{...I(false),resize:"vertical"}}/>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
              <button onClick={()=>aprovar(sv.ID_Solicitacao,"rejeitar")} disabled={load} style={{padding:14,borderRadius:10,border:"1px solid var(--rbr)",background:"var(--rbg)",color:"var(--rtx)",cursor:"pointer",fontWeight:600,fontSize:15}}>Rejeitar</button>
              <button onClick={()=>aprovar(sv.ID_Solicitacao,"aprovar")} disabled={load} style={{padding:14,borderRadius:10,border:"none",background:"var(--primary)",color:"#fff",cursor:"pointer",fontWeight:600,fontSize:15}}>{load?"Processando...":"Aprovar"}</button>
            </div>
          </div>}
        </div>;
      })()}
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
